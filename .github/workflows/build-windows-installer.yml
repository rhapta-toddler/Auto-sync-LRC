name: Build Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Build the app with PyInstaller
        run: ./packaging/build_windows.ps1

      - name: Smoke-test the packaged app
        run: |
          $p = Start-Process -FilePath "dist\Auto-sync-LRC\Auto-sync-LRC.exe" -ArgumentList "--selftest","$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "packaged app self-test failed" }

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build the installer
        run: |
          $version = python -c "import auto_sync_lrc; print(auto_sync_lrc.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\auto-sync-lrc.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Smoke-test the installer (silent install, then run the installed app)
        run: |
          $dir = "$PWD\installed-app"
          Start-Process -FilePath "installer-out\Auto-sync-LRC-Setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir" -Wait
          $exe = Join-Path $dir "Auto-sync-LRC.exe"
          if (-not (Test-Path $exe)) { throw "installer did not install the app" }
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest","$PWD\selftest-installed.txt" -Wait -PassThru
          Get-Content selftest-installed.txt
          if ($p.ExitCode -ne 0) { throw "installed app self-test failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: Auto-sync-LRC-Setup
          path: installer-out/Auto-sync-LRC-Setup.exe

      - name: Attach the installer to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" installer-out/Auto-sync-LRC-Setup.exe --title "Auto-sync-LRC ${{ github.ref_name }}" --generate-notes
